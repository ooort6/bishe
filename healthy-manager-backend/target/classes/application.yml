server:
  port: 8082
spring:
  application:
    name: healthy-manager
  datasource:
    username: root
    password: rt130125
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/healthy?&serverTimezone=GMT%2B8&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull
